name: CannonsLevelGen Daily Production

# Month-2+ workflow: generates ONE validated-winnable level and pushes it
# straight into alejandroZumbado/cannons (GeneratedLevels/incoming/), fully cloud-side
# — checks out BOTH repos on a disposable runner, no local machine involved.
#
# Went live 2026-09-13 (explicit user request). Guardrails already in place
# before this went on a schedule: the CHAMPION_WIN_RATE_THRESHOLD gate in
# daily_generator.py still refuses to generate anything if the champion
# policy ever drops below 85% on the training benchmark; every candidate is
# rejected/retried (no extra LLM cost) if it duplicates the shape of a level
# that already exists (production/level_registry.scan_existing_signatures,
# see Level.shape_signature — tipo/skin doesn't count, only the actual
# layout); and every level that does get generated is difficulty-checked
# against BOTH the champion and the untrained baseline policy
# (verification/level_audit.audit_level) before being pushed, so this one
# run is "generate + push + validate difficulty", no separate workflow
# needed. Import into Unity (GeneratedLevels/incoming/ -> Assets/Levels/)
# stays a manual human step regardless — see Cannons/CLAUDE.md.
on:
  schedule:
    - cron: '0 6 * * *'   # once daily, 6am UTC
  workflow_dispatch:

permissions:
  contents: write

# Same group as learning.yml ON PURPOSE — both workflows read/write the same
# state/budget.json in this repo. Without a shared group, a learning cycle
# and a production run could each check the remaining daily budget before
# either has pushed its spend, and together spend past the real cap (each
# only sees whatever was last committed, not what the other is mid-spending).
# Queuing instead of running in parallel closes that race.
concurrency:
  group: cannonslevelgen-learning-cycle
  cancel-in-progress: false

jobs:
  daily-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout CannonsLevelGen (this repo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Cannons (the game repo — separate push target)
        uses: actions/checkout@v5
        with:
          repository: alejandroZumbado/cannons
          fetch-depth: 0
          token: ${{ secrets.CANNONS_PUSH_TOKEN }}
          path: cannons_checkout

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and push one level
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANNONS_REPO_PATH: ${{ github.workspace }}/cannons_checkout
          CI: true
          PYTHONUNBUFFERED: "1"
        # -m (not a bare path) so Python puts the repo root on sys.path —
        # daily_generator.py does `import config`, `from llm import ...` etc,
        # which only resolve when run as a module from repo root, not when
        # invoked as production/daily_generator.py (that puts production/
        # itself on sys.path[0] instead). Verified this failed for real on
        # the first cloud run before this fix.
        run: python -m production.daily_generator
